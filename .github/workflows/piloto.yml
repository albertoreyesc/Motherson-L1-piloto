name: Validar y desplegar piloto
on:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publicar el artefacto validado (requiere environment piloto aprobado)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Frontend
        working-directory: portal/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Configuración y publicación .NET
        run: |
          dotnet run --project portal/pruebas-azure/Azure.Pruebas.csproj
          dotnet publish portal/backend/Motherson.Api/Motherson.Api.csproj -c Release -o artifact
          Copy-Item portal/config artifact/config -Recurse
          Compress-Archive -Path artifact/* -DestinationPath piloto.zip
      - uses: actions/upload-artifact@v4
        with:
          name: piloto
          path: piloto.zip
          retention-days: 7
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: piloto
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: piloto
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: piloto.zip
