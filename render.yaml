services:
  - type: web
    name: motherson-l1-piloto
    runtime: docker
    plan: free
    region: ohio
    branch: piloto/preparacion-gratuita-2026-11-19
    dockerfilePath: ./despliegue/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: Pilot__Enabled
        value: 'true'
      - key: MVP_SQL_TRANSACCIONAL
        value: 'true'
      - key: MVP_AZURE_SERVER
        value: motherson-piloto-l1-20261119.database.windows.net
      - key: MVP_BASE_COMPARTIDA
        value: Motherson_L1
      - key: PowerBI__Mode
        value: AppOwnsData
      - key: PowerBI__AllowTrialTokens
        value: 'false'
      - key: PowerBI__CapacityReady
        value: 'false'
      - key: AllowedHosts
        sync: false
      - key: ConnectionStrings__Sql
        sync: false
      - key: Pilot__KeyEncryptionCertificate
        sync: false
      - key: Pilot__KeyEncryptionPassword
        sync: false
